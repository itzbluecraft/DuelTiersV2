name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Arrange Maven structure
        run: |
          mkdir -p src/main/java/dev/tierduels src/main/resources
          mv *.java src/main/java/dev/tierduels/
          mv config.yml plugin.yml src/main/resources/
      - run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: TierDuels
          path: target/TierDuels-*.jar
