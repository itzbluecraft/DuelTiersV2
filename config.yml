# ==========================================
#   TierDuels
#   Join the queue with /duel and win duels to climb
#   None -> LT5 -> LT4 -> LT3 -> LT2 -> LT1
# ==========================================

prefix: "&b[Duels] &r"

# Wins needed to go up one tier (LT1 is the top tier)
wins-per-tier: 3

# Tier of new players: None (they reach LT5 after their first tier of wins) or LT5
start-tier: None

# Countdown before the fight starts (players are frozen)
countdown-seconds: 5

# Duel ends in a draw (no tier change) after this many seconds, 0 = no limit
duel-time-limit-seconds: 300

# Seconds between the end of a duel and teleporting the loser back
end-delay-seconds: 3

# The loser's whole inventory drops in the arena and only the winner can pick it up.
# The winner then has loot-time-seconds to collect it and uses /duel leave when done.
# Set loser-drops-items to false for friendly duels where nobody loses anything.
loser-drops-items: true
loot-time-seconds: 300

# After the last win of a tier (3/3) the player waits this long before the tier-up
promotion-delay-seconds: 5

# Arena regeneration: biggest region that can be saved (in blocks) and
# how many chunks are put back per tick (lower = less lag, slower regen)
arena-max-blocks: 1000000
regen-chunks-per-tick: 4

# Item given by /duel wand (left click = position 1, right click = position 2)
# For example WOODEN_AXE or STICK
wand-material: WOODEN_AXE

# Announce results / tier ups to the whole server
broadcast-results: true

# Show the tier in chat and in the tab list
chat-prefix: true
tab-prefix: true

# Fill the empty slots of the /duel menu with glass panes
gui-filler: true

# Commands usable during a duel (players with tierduels.bypass can use everything)
duel-allowed-commands:
  - duel
  - tier
  - msg
  - r

# Players fight with their own gear (no kit). They are healed to full
# health and food before and after a duel, and teleported back afterwards.

